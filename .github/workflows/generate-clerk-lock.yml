name: Generate Clerk Lock

on:
  push:
    branches:
      - gate-b-identity
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: gate-b-identity

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Clerk TanStack Start SDK
        run: bun add @clerk/tanstack-react-start

      - name: Commit generated dependency state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          if git diff --cached --quiet; then
            echo "Dependency state already current."
            exit 0
          fi
          git commit -m "chore(identity): lock Clerk TanStack Start SDK [skip ci]"
          git push origin HEAD:gate-b-identity
