name: Generate Clerk Lock

on:
  push:
    branches:
      - gate-b-identity
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Clerk TanStack Start SDK
        run: bun add @clerk/tanstack-react-start

      - name: Upload generated dependency state
        uses: actions/upload-artifact@v4
        with:
          name: clerk-dependency-state
          path: |
            package.json
            bun.lock
          if-no-files-found: error
          retention-days: 1
