name: Frontend CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feat/frontend-production-build-2026-08-16

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Production frontend verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Semantic lint — production frontend
        run: >-
          bunx eslint
          src/components/brand
          src/components/hero
          src/components/layout/SiteFooter.tsx
          src/components/navigation
          src/components/product
          src/components/sections
          src/config/site.ts
          src/lib/content.ts
          src/routes
          --rule 'prettier/prettier: off'

      - name: Production build
        run: bun run build
