name: Frontend CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feat/frontend-production-build-2026-08-16

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Production frontend verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript typecheck
        run: bunx tsc --noEmit

      - name: Semantic lint — application source
        run: >-
          bunx eslint
          src
          --rule 'prettier/prettier: off'

      - name: Production build
        run: bun run build
