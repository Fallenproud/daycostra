name: Normalize Source

on:
  push:
    branches:
      - gate-b-ui-reconcile
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: gate-b-ui-reconcile

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Normalize Prettier and auto-fixable ESLint findings
        run: |
          bun run format
          bunx eslint . --fix || true

      - name: Commit normalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Source already normalized."
            exit 0
          fi
          git commit -m "chore(ui): normalize source formatting [skip ci]"
          git push origin HEAD:gate-b-ui-reconcile
